# ===== group: news (3 endpoints) =====

[[read.endpoint]]
id = "news.for_symbol"
method = "GET"
path = "/news/:symbol"
tables = ["news.articles", "news.articles_by_symbol"]
ttl = "60s"
shape = "rows"
strip_lineage = true
row_cap = 200
sql = """
    WITH base AS (
      SELECT published_at, publisher, headline, summary, url, category
        FROM news.articles
       WHERE symbol = :symbol AND published_at >= COALESCE(:since, now() - interval '30 days')
      UNION ALL
      SELECT published_at, publisher, headline, summary, url, category
        FROM news.articles_by_symbol
       WHERE symbol = :symbol AND published_at >= COALESCE(:since, now() - interval '30 days')
    ),
    per_url AS (
      SELECT DISTINCT ON (url)
             published_at, publisher, headline, summary, url, category
        FROM base
       ORDER BY url, published_at DESC
    )
    SELECT published_at, publisher, headline, summary, url, category
      FROM per_url
     ORDER BY published_at DESC
     LIMIT :limit
"""
  [[read.endpoint.param]]
  name = "symbol"; kind = "path"; type = "symbol"
  [[read.endpoint.param]]
  name = "since"; kind = "query"; type = "timestamp"
  [[read.endpoint.param]]
  name = "limit"; kind = "query"; type = "int"; default = 50; min = 1; max = 200

[[read.endpoint]]
id = "news.social_sentiment"
method = "GET"
path = "/news/social-sentiment/:symbol"
tables = ["news.social_sentiment"]
ttl = "60s"
shape = "rows"
strip_lineage = true
row_cap = 1000
sql = """
    SELECT ts, mention::float8 AS mention, positive_score::float8 AS positive_score,
           negative_score::float8 AS negative_score, positive_mention::float8 AS positive_mention,
           negative_mention::float8 AS negative_mention
      FROM news.social_sentiment
     WHERE symbol = :symbol AND ts >= COALESCE(:since, '-infinity'::timestamptz)
     ORDER BY ts DESC
     LIMIT :limit
"""
  [[read.endpoint.param]]
  name = "symbol"; kind = "path"; type = "symbol"
  [[read.endpoint.param]]
  name = "since"; kind = "query"; type = "timestamp"
  [[read.endpoint.param]]
  name = "limit"; kind = "query"; type = "int"; default = 200; min = 1; max = 1000

[[read.endpoint]]
id = "news.symbol_sentiment"
method = "GET"
path = "/news/symbol-sentiment/:symbol"
tables = ["news.symbol_sentiment"]
ttl = "60s"
shape = "rows"
strip_lineage = true
row_cap = 60
sql = """
    SELECT period_end_date, buzz::float8 AS buzz, weekly_avg::float8 AS weekly_avg,
           articles_last_week, sentiment_score::float8 AS sentiment_score,
