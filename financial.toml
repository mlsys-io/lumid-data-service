# financial.toml — declarative read-endpoint specs (config half of the platform split).
# Generated from the Rust query modules; SQL copied verbatim for parity. Valid TOML.
# Bespoke endpoints (jsonb pivot / Redis / multi-query) live in findata-ext — see DEFERRED_TO_EXT.md.


# ===== fundamentals+analysis (3) =====
[[read.endpoint]]
id = "fundamentals.latest"
method = "GET"
path = "/fundamentals/:symbol/latest"
tables = ["fundamentals.latest_per_symbol"]
ttl = "6h"
shape = "one"
strip_lineage = true
cache = true
sql = """
SELECT symbol, period_end_date, period_type, report_date, currency,
       revenue, gross_profit, operating_income, ebitda, net_income,
       eps, eps_diluted,
       total_assets, total_liabilities, total_equity,
       cash_and_equivalents, total_debt, long_term_debt,
       operating_cash_flow, investing_cash_flow, financing_cash_flow,
       free_cash_flow, capex, dividends_paid, stock_repurchases
  FROM fundamentals.latest_per_symbol
 WHERE symbol = :symbol AND source = 'fmp'
"""

[[read.endpoint.param]]
name = "symbol"
kind = "path"
type = "symbol"
transform = "upper"

[[read.endpoint]]
id = "fundamentals.history"
method = "GET"
path = "/fundamentals/:symbol/history"
tables = ["fundamentals.income_statement", "fundamentals.balance_sheet", "fundamentals.cash_flow_statement"]
ttl = "6h"
shape = "rows"
strip_lineage = true
row_cap = 200
cache = true
sql = """
SELECT {{cols}}
  FROM {{table}}
 WHERE symbol = :symbol AND source = 'fmp'{{period_filter}}
 ORDER BY period_end_date DESC
 LIMIT :limit
"""

[[read.endpoint.param]]
name = "symbol"
kind = "path"
type = "symbol"
transform = "upper"

[[read.endpoint.param]]
name = "statement"
kind = "query"
type = "enum"
default = "income"
[read.endpoint.param.select.income]
table = "fundamentals.income_statement"
cols = "period_end_date, period_type, revenue, gross_profit, operating_income, ebitda, net_income, eps"
[read.endpoint.param.select.balance]
table = "fundamentals.balance_sheet"
cols = "period_end_date, period_type, total_assets, total_liabilities, total_equity, cash_and_equivalents, total_debt"
[read.endpoint.param.select.cashflow]
table = "fundamentals.cash_flow_statement"
cols = "period_end_date, period_type, operating_cash_flow, investing_cash_flow, financing_cash_flow, free_cash_flow, capex"

[[read.endpoint.param]]
name = "period"
kind = "query"
type = "enum"
default = "quarter"
[read.endpoint.param.select.quarter]
period_filter = " AND period_type IN ('Q1','Q2','Q3','Q4')"
[read.endpoint.param.select.fy]
period_filter = " AND period_type = 'FY'"
[read.endpoint.param.select.all]
period_filter = ""

[[read.endpoint.param]]
name = "limit"
kind = "query"
type = "int"
default = 40
min = 1
max = 200

[[read.endpoint]]
id = "analysis.key_metrics"
method = "GET"
path = "/key-metrics/:symbol"
tables = ["fundamentals.key_metrics"]
ttl = "6h"
shape = "rows"
strip_lineage = true
row_cap = 200
cache = true
sql = """
SELECT period_end_date, period_type, pe::float8, pb::float8, ps::float8,
       ev_ebitda::float8, ev_revenue::float8, debt_to_equity::float8,
       current_ratio::float8, quick_ratio::float8, roe::float8, roa::float8,
       fcf_yield::float8
  FROM fundamentals.key_metrics
 WHERE symbol = :symbol AND source = 'fmp'{{period_filter}}
 ORDER BY period_end_date DESC
 LIMIT :limit
"""

[[read.endpoint.param]]
name = "symbol"
kind = "path"
type = "symbol"
transform = "upper"

[[read.endpoint.param]]
name = "period"
kind = "query"
type = "enum"
default = "quarter"
[read.endpoint.param.select.quarter]
period_filter = " AND period_type IN ('Q1','Q2','Q3','Q4')"
[read.endpoint.param.select.fy]
period_filter = " AND period_type = 'FY'"
[read.endpoint.param.select.all]
period_filter = ""

[[read.endpoint.param]]
name = "limit"
kind = "query"
type = "int"
default = 20
min = 1
max = 200

# ===== estimates+investors (11) =====
[[read.endpoint]]
id = "estimates.price_target"
method = "GET"
path = "/estimates/:symbol/price-target"
tables = ["estimates.price_target_consensus", "estimates.price_target_summary"]
ttl = "3h"
shape = "one"
strip_lineage = true
cache = true
sql = """
SELECT c.symbol,
       c.consensus::float8 AS target_consensus,
       c.high::float8      AS target_high,
       c.low::float8       AS target_low,
       s.last_avg::float8  AS target_median,
       s.num_analysts      AS analysts,
       GREATEST(c.ingest_ts, s.ingest_ts) AS updated_at
  FROM estimates.price_target_consensus c
  LEFT JOIN estimates.price_target_summary s
    ON s.symbol = c.symbol AND s.source = c.source
 WHERE c.symbol = :symbol AND c.source = 'fmp'
 LIMIT 1
"""

[[read.endpoint.param]]
name = "symbol"
kind = "path"
type = "symbol"
transform = "upper"

