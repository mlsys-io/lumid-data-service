path = "/kols"
tables = ["news.kol_roster"]
ttl = "60s"
shape = "rows"
strip_lineage = true
row_cap = 2000
sql = """
  SELECT handle, display_name, twitter_id, follower_tier, notes, active, added_at,
         added_by, updated_at FROM news.kol_roster WHERE (:include_inactive::boolean OR active)
   ORDER BY follower_tier NULLS LAST, handle
"""
  [[read.endpoint.param]]
  name = "include_inactive"; kind = "query"; type = "bool"; default = false
