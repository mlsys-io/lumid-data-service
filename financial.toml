# ===== news (6) =====
[[read.endpoint]]
id = "news.for_symbol"
method = "GET"
path = "/news/:symbol"
tables = ["news.articles", "news.articles_by_symbol"]
ttl = "60s"
shape = "rows"
strip_lineage = true
row_cap = 200
cache = true
sql = """
WITH base AS (
  SELECT published_at, publisher, headline, summary, url, category
    FROM news.articles
   WHERE symbol = :symbol AND published_at >= {{since_value}}
  UNION ALL
  SELECT published_at, publisher, headline, summary, url, category
    FROM news.articles_by_symbol
   WHERE symbol = :symbol AND published_at >= {{since_value}}
),
per_url AS (
  SELECT DISTINCT ON (url)
         published_at, publisher, headline, summary, url, category
    FROM base
   ORDER BY url, published_at DESC
)
SELECT published_at, publisher, headline, summary, url, category
  FROM per_url
 ORDER BY published_at DESC
 LIMIT :limit
"""

[[read.endpoint.param]]
name = "symbol"
kind = "path"
type = "symbol"
transform = "upper"

[[read.endpoint.param]]
name = "since"
kind = "query"
type = "timestamp"
required = false
[read.endpoint.param.present]
since_value = ":since"
[read.endpoint.param.absent]
since_value = "now() - interval '30 days'"

[[read.endpoint.param]]
name = "limit"
kind = "query"
type = "int"
default = 50
min = 1
max = 200

[[read.endpoint]]
id = "news.latest"
method = "GET"
path = "/news/latest"
tables = ["news.articles"]
ttl = "60s"
shape = "rows"
strip_lineage = true
row_cap = 200
cache = true
sql = """
SELECT published_at, publisher, headline, summary, url, category, symbol
  FROM news.articles
 WHERE published_at >= {{since_value}}{{category_filter}}
 ORDER BY published_at DESC
 LIMIT :limit
"""

[[read.endpoint.param]]
name = "since"
kind = "query"
type = "timestamp"
required = false
[read.endpoint.param.present]
since_value = ":since"
[read.endpoint.param.absent]
since_value = "now() - interval '30 days'"

[[read.endpoint.param]]
name = "category"
kind = "query"
type = "enum"
required = false
[read.endpoint.param.select.general]
category_filter = " AND category = 'general_market'"
[read.endpoint.param.select.stock]
category_filter = " AND category = 'stock_market'"
[read.endpoint.param.select.press]
category_filter = " AND category = 'press_release'"
[read.endpoint.param.select.press_release]
category_filter = " AND category = 'press_release'"
[read.endpoint.param.select.crypto]
category_filter = " AND category = 'crypto'"
[read.endpoint.param.select.forex]
category_filter = " AND category = 'forex'"
[read.endpoint.param.select.company]
category_filter = " AND category = 'company'"
[read.endpoint.param.absent]
category_filter = ""

[[read.endpoint.param]]
name = "limit"
kind = "query"
type = "int"
default = 50
min = 1
max = 200

[[read.endpoint]]
id = "news.search"
method = "GET"
path = "/news/search"
tables = ["news.articles"]
ttl = "60s"
shape = "rows"
strip_lineage = true
row_cap = 200
cache = true
sql = """
SELECT published_at, publisher, headline, summary, url, category, symbol
  FROM news.articles
 WHERE search_tsv @@ websearch_to_tsquery('english', :q) AND published_at >= {{since_value}}{{category_filter}}
 ORDER BY published_at DESC
 LIMIT :limit
"""

[[read.endpoint.param]]
name = "q"
kind = "query"
type = "str"
required = true

[[read.endpoint.param]]
name = "since"
kind = "query"
type = "timestamp"
required = false
[read.endpoint.param.present]
since_value = ":since"
[read.endpoint.param.absent]
since_value = "now() - interval '30 days'"

[[read.endpoint.param]]
name = "category"
kind = "query"
type = "enum"
required = false
[read.endpoint.param.select.general]
category_filter = " AND category = 'general_market'"
[read.endpoint.param.select.stock]
category_filter = " AND category = 'stock_market'"
[read.endpoint.param.select.press]
category_filter = " AND category = 'press_release'"
[read.endpoint.param.select.press_release]
category_filter = " AND category = 'press_release'"
[read.endpoint.param.select.crypto]
category_filter = " AND category = 'crypto'"
[read.endpoint.param.select.forex]
category_filter = " AND category = 'forex'"
[read.endpoint.param.select.company]
category_filter = " AND category = 'company'"
[read.endpoint.param.absent]
category_filter = ""

[[read.endpoint.param]]
name = "limit"
kind = "query"
type = "int"
default = 50
min = 1
max = 200

[[read.endpoint]]
id = "news.stats"
method = "GET"
path = "/news/stats"
tables = ["news.articles"]
ttl = "60s"
shape = "envelope"
envelope_key = "categories"
strip_lineage = true
row_cap = 200
cache = true
sql = """
SELECT category,
       count(*) FILTER (WHERE published_at > now() - interval '7 days')  AS rows_last_7d,
       count(*) FILTER (WHERE published_at > now() - interval '30 days') AS rows_last_30d,
       max(published_at) AS latest_in_60d
  FROM news.articles
 WHERE published_at > now() - interval '60 days'
 GROUP BY category
 ORDER BY rows_last_30d DESC NULLS LAST
"""

