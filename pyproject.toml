[project]
name = "findata-injection"
version = "0.1.0"
description = "findata Injection service — portable write plane (typed/adapter/stream/file/blob/webhook ingress with full provenance)."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "psycopg2-binary>=2.9",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "cachetools>=5.3",
    "scalar-fastapi>=1.0.3",
    "httpx>=0.27",
    "certifi>=2024",
    # Optional structured-file formats (imported lazily by ingest/parsers.py
    # and ingest/decompress.py — present so file mode supports every format).
    "lxml>=5.0",
    "pyyaml>=6.0",
    "pyarrow>=15.0",
    "zstandard>=0.22",
    # Needed only by the optional adapter bridge: the mounted loaders/lib
    # imports ijson at module load. Harmless when adapter mode is off.
    "ijson>=3.2",
]

[tool.setuptools]
packages = ["injection", "injection.ingest", "injection.routes"]
