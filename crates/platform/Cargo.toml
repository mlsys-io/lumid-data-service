[package]
name = "lumid-platform"
edition.workspace = true
version.workspace = true
license.workspace = true

# Platform library only — the binary lives in the app's bin crate.

[dependencies]
axum = { version = "0.7", features = ["macros", "ws", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
clickhouse = { version = "0.13", default-features = false, features = ["rustls-tls"] }
deadpool-postgres = "0.14"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
rust_decimal = { version = "1", features = ["db-tokio-postgres"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
moka = { version = "0.12", features = ["future"] }
sha2 = "0.10"
hmac = "0.12"
dashmap = "6"
redis = { version = "0.27", default-features = false, features = ["tokio-comp"] }
once_cell = "1"
bytes = "1"
futures-util = "0.3"
object_store = { version = "0.11", features = ["aws"] }
csv = "1"
flate2 = "1"
zstd = "0.13"
hex = "0.4"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots", "connect"] }
tokio-util = { version = "0.7", features = ["io"] }
# Pin the rustls crypto provider explicitly: both `ring` and `aws-lc-rs` are in
# the graph (the latter via the ClickHouse client), so rustls 0.23 can't
# auto-pick — install ring once at boot before any TLS use (see boot::serve).
rustls = { version = "0.23", features = ["ring"] }
toml = "0.8"
humantime = "2"
http-body = "1"
