# Deployment wiring for the unified Rust (axum) data service.
#
# This is the `rust-rewrite` of BOTH the read API (api/, :5010) and the write
# plane (injection/, :5011), merged into a single binary. It is deployed here on
# host port 5012 so it can run ALONGSIDE the existing Python services during
# cutover — flip the public ingress to :5012 once it's validated, then retire
# finai-api + finai-injection.
#
#   docker compose -f docker-compose.rust.yml up -d --build
#
# Reads the same .env as the Python services (DB password, local keys, blob URL).

services:
  lumid-data-service:
    build:
      context: .
      dockerfile: Dockerfile.rust
    image: lumid-data-service:latest
    container_name: lumid-data-service
    restart: unless-stopped
    networks:
      - findata-net
    ports:
      - "0.0.0.0:5012:8088"
    volumes:
      # Blob storage (RW) — SHARED with the Python read/write services. Bytes
      # uploaded via POST /ingest/blob land here; keep FINDATA_BLOB_PUBLIC_BASE_URL
      # identical across every service so emitted storage_url values resolve.
      - /data/findata/blobs:/app/blobs
      # OPTIONAL — KOL media (read-only, ~770 GB). Mount + set FINDATA_KOL_MEDIA_ROOT
      # to enable GET /kols/media/*; omit both to leave media serving disabled.
      # - /data/findata/twitter_media:/app/kol_media:ro
    extra_hosts:
      # Lumilake handoff reaches the docker host gateway.
      - "host.docker.internal:host-gateway"
    environment:
      FINDATA_BIND_ADDR: "0.0.0.0:8088"
      # Same Postgres as the Python services (one warehouse, unified provenance).
      FINDATA_DB_HOST: finai-tsdb-pg17
      FINDATA_DB_PORT: "5432"
      FINDATA_DB_USER: postgres
      FINDATA_DB_PASSWORD: ${FINDATA_DB_PASSWORD:?set FINDATA_DB_PASSWORD in .env}
      FINDATA_DB_NAME: fin_ai_world_model_v2
      FINDATA_POOL_MAX: "20"
      # Generous statement timeout: large stream/file merges must not be killed
      # mid-COPY (a wedged backend still can't pin forever).
      FINDATA_STATEMENT_TIMEOUT_MS: "600000"
      # Auth — same Lumid settings + local-key bypass as the Python services so a
      # PAT / local key validates identically everywhere (role=local for keys).
      FINDATA_LUMID_URL: "https://lum.id"
      FINDATA_LUMID_ENABLED: "true"
      FINDATA_LUMID_CACHE_TTL: "300"
      FINDATA_LUMID_TIMEOUT_S: "5"
      FINDATA_API_KEYS: "${FINDATA_API_KEYS:-}"
      FINDATA_RATE_LIMIT_ANON: "20/minute"
      FINDATA_RATE_LIMIT_AUTHED: "600/minute"
      # Read-only Redis (quote-snapshot last-tick + /usage counters). Empty
      # disables; /quotes then returns no_cache.
      FINDATA_REDIS_URL: "${FINDATA_REDIS_URL:-redis://finai-redis:6379}"
      # Blob plane — local filesystem under the bind-mounted /app/blobs.
      FINDATA_BLOB_ROOT: "${FINDATA_BLOB_ROOT:-/app/blobs}"
      FINDATA_BLOB_PUBLIC_BASE_URL: "${FINDATA_BLOB_PUBLIC_BASE_URL:-https://kv.run:5000}"
      FINDATA_BLOB_MAX_BYTES: "${FINDATA_BLOB_MAX_BYTES:-104857600}"
      # KOL media serving — empty disables GET /kols/media/*.
      FINDATA_KOL_MEDIA_ROOT: "${FINDATA_KOL_MEDIA_ROOT:-}"
      # LLM reverse proxy — empty backend disables /v1/* (returns 503).
      FINDATA_LLM_BACKEND_URL: "${FINDATA_LLM_BACKEND_URL:-}"
      FINDATA_LLM_DEFAULT_MODEL: "${FINDATA_LLM_DEFAULT_MODEL:-}"
      # Lumilake handoff — fire-and-forget POST after each successful ingest.
      # Empty disables.
      FINDATA_LUMILAKE_BASE_URL: "${FINDATA_LUMILAKE_BASE_URL:-http://host.docker.internal:9000}"
      FINDATA_LUMILAKE_WORKFLOW: "${FINDATA_LUMILAKE_WORKFLOW:-findata-ingress-followup}"
      FINDATA_LUMILAKE_TOKEN: "${FINDATA_LUMILAKE_TOKEN:-}"
      FINDATA_LUMILAKE_TIMEOUT_S: "10"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8088/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 512m
    cpus: 2.0

networks:
  findata-net:
    external: true
